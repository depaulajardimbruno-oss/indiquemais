name: CI

# Roda em todo pull request que entra em develop (teste), staging (homologação) ou main (produção).
on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
